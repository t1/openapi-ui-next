name: Java CI

on:
  push:
    branches: [trunk]
  schedule:
    - cron: '38 16 * * 5'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'maven'

      - name: Install Playwright WebKit dependencies
        run: mvn --batch-mode --no-transfer-progress -pl core exec:java -Dexec.classpathScope=test -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps webkit"

      - run: mvn --batch-mode --show-version --no-transfer-progress -DCI=GitHub install
