openapi: 3.1.0
info:
  title: rescueTABLET Missions
  version: "1.2"
  summary: Missions API
  description: |
    API for the management of missions in rescueTABLET.
    With a very long unbreakable token like https://missions-api.rescuetablet.com/some/very/long/path/segment/that/does/not/wrap that must not overflow into the server selector area.
servers:
  - url: https://missions-api.rescuetablet.com/
    description: Production environment
paths:
  /pets:
    get:
      summary: List pets
      operationId: listPets
      responses:
        '200':
          description: A list of pets
