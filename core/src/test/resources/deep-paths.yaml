openapi: 3.0.3
info:
  title: Deep Paths API
  version: "1.0"
servers:
  - url: https://api.example.com
paths:
  /organizations/{orgId}/departments/{deptId}/employees:
    get:
      summary: List employees
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
        - name: deptId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
    post:
      summary: Create employee
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
        - name: deptId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Created
    put:
      summary: Update employee
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
        - name: deptId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
    delete:
      summary: Delete employee
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
        - name: deptId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
