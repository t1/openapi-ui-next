openapi: 3.0.3
info:
  title: Form Encoded Test API
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /login:
    post:
      summary: User login
      operationId: login
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                remember:
                  type: boolean
      responses:
        '200':
          description: Login successful
