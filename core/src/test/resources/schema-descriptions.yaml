openapi: 3.1.0
info:
  title: Test API
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /pets/{petId}:
    get:
      summary: Get a pet
      operationId: getPet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A pet
          content:
            application/json:
              schema:
                title: Pet
                description: Represents a pet in the store
                type: object
                required: [id, name]
                properties:
                  id:
                    type: integer
                    examples:
                      - 1
                    description: Unique identifier
                  name:
                    type: string
                    example: Max
                    description: The display name of the pet
                  status:
                    type: string
                    enum: [available, adopted, pending]
