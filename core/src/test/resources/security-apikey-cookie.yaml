openapi: 3.0.3
info:
  title: Security Test API - apiKey Cookie
  version: 1.0.0
servers:
  - url: https://api.example.com
components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
      description: Session cookie authentication
security:
  - CookieAuth: []
paths:
  /pets:
    get:
      summary: List pets
      operationId: listPets
      responses:
        '200':
          description: A list of pets
