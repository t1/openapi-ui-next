openapi: 3.0.3
info:
  title: Security Test API - HTTP Basic
  version: 1.0.0
servers:
  - url: https://api.example.com
components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication
security:
  - BasicAuth: []
paths:
  /pets:
    get:
      summary: List pets
      operationId: listPets
      responses:
        '200':
          description: A list of pets
