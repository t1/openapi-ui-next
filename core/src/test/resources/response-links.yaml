openapi: 3.0.3
info:
  title: Test API
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /pets:
    get:
      summary: List pets
      operationId: listPets
      responses:
        '200':
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
  /pets/{petId}:
    get:
      summary: Get a pet
      operationId: getPet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A pet
          headers:
            X-Request-Id:
              description: Echoed request identifier
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  owner:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                  visits:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        reason:
                          type: string
                        treatments:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              name:
                                type: string
          links:
            GetOwner:
              operationId: getOwner
              parameters:
                ownerId: $response.body#/owner/id
              description: Get the owner of this pet
            GetPetByRequestId:
              operationId: getPetByRequestId
              parameters:
                requestId: $response.header.X-Request-Id
              description: Look up by request ID
            GetVisits:
              operationId: getVisits
              parameters:
                petId: $response.body#/id
              description: List visits for this pet
            GetPetAgain:
              operationId: getPet
              parameters:
                petId: $response.body#/id
              description: Reload this pet
          x-links:
            GetVisitDetail:
              operationId: getVisitDetail
              parameters:
                visitId: $response.body#/visits[*]/id
              description: Get details of this visit
            GetTreatment:
              operationId: getTreatment
              parameters:
                treatmentId: $response.body#/visits[*]/treatments[*]/id
              description: Get treatment details
  /owners/{ownerId}:
    get:
      summary: Get an owner
      operationId: getOwner
      parameters:
        - name: ownerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: An owner
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
  /pets/by-request-id/{requestId}:
    get:
      summary: Get pet by request ID
      operationId: getPetByRequestId
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A pet
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
  /pets/{petId}/visits:
    get:
      summary: List visits
      operationId: getVisits
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A list of visits
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    date:
                      type: string
  /pets/{petId}/visits/{visitId}:
    get:
      summary: Get a visit
      operationId: getVisitDetail
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
        - name: visitId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A visit
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  reason:
                    type: string
  /treatments/{treatmentId}:
    get:
      summary: Get a treatment
      operationId: getTreatment
      parameters:
        - name: treatmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A treatment
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
