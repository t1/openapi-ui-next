openapi: 3.0.3
info:
  title: Security Test API - apiKey Query
  version: 1.0.0
servers:
  - url: https://api.example.com
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: query
      name: api_key
      description: API key as query parameter
security:
  - ApiKeyAuth: []
paths:
  /pets:
    get:
      summary: List pets
      operationId: listPets
      responses:
        '200':
          description: A list of pets
