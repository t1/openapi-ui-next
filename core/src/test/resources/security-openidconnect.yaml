openapi: 3.0.3
info:
  title: Security Test API - OpenID Connect
  version: 1.0.0
servers:
  - url: https://api.example.com
components:
  securitySchemes:
    OpenIdConnect:
      type: openIdConnect
      description: OpenID Connect authentication
      openIdConnectUrl: https://example.com/.well-known/openid-configuration
security:
  - OpenIdConnect: []
paths:
  /pets:
    get:
      summary: List pets
      operationId: listPets
      responses:
        '200':
          description: A list of pets
