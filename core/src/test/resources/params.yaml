openapi: 3.0.3
info:
  title: Pet Store
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /pets/{petId}:
    get:
      summary: Get a pet
      description: Returns a single pet by its unique identifier. The response includes all available fields by default, but you can use the fields parameter to request only specific attributes. This is useful for reducing payload size when you only need a subset of the pet data. The pet object contains the pet's name, species, breed, date of birth, vaccination records, and current owner information.
      operationId: getPet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
        - name: fields
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated list of fields
      responses:
        '200':
          description: A pet
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
