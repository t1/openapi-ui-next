openapi: 3.0.3
info:
  title: Multi Method API
  version: "1.0"
paths:
  /pets:
    get:
      summary: List pets
      description: Returns all pets from the system. Supports filtering by status via the optional query parameter. Results are sorted by ID in ascending order. The response includes each pet's name, species, status, and owner information. Pagination is not yet supported; all matching records are returned in a single response.
      tags:
        - pets
      responses:
        "200":
          description: OK
    post:
      summary: Create a pet
      description: Adds a new pet to the store.
      tags:
        - pets
      responses:
        "201":
          description: Created
  /pets/{id}:
    get:
      summary: Get pet by ID
      description: Returns a single pet.
      deprecated: true
      externalDocs:
        url: https://example.com/docs/pets
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
    delete:
      summary: Delete a pet
      description: Permanently removes a pet.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /pets/{petId}/visits/{visitId}:
    get:
      summary: Get a visit
      description: Returns a single visit for a pet.
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
        - name: visitId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  date:
                    type: string
